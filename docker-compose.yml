services:
  db:
    image: postgres:17-alpine
    container_name: narzivo-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: narzivo
      POSTGRES_USER: narzivo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Brak POSTGRES_PASSWORD w .env}

    ports:
      - "5432:5432"

    volumes:
      - narzivo_pg:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U narzivo -d narzivo
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  narzivo_pg: